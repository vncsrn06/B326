<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0">

  <title>Love Claw Machine 💗</title>

  <link
          rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="page">

  <!-- =========================================
       TITLE
  ========================================== -->

  <h1>
    <span>Claw Machine</span> Game
  </h1>


  <!-- =========================================
       START GAME
  ========================================== -->

  <button
          id="startButton"
          class="start-button">

    ♥ START GAME ♥

  </button>


  <!-- =========================================
       MACHINE
  ========================================== -->

  <div class="machine">

    <div
            id="glass"
            class="glass">


      <!-- =====================================
           CLAW
      ====================================== -->

      <div
              id="claw"
              class="claw">

        <div class="rope"></div>

        <div class="claw-head">

          <div class="claw-light"></div>

        </div>

        <div class="finger left"></div>

        <div class="finger right"></div>

      </div>


      <!-- =====================================
           TEDDY AREA
      ====================================== -->

      <div
              id="playfield"
              class="playfield">


        <!-- TEDDY 1 -->

        <div
                class="teddy teddy1"
                data-id="1">

          <div class="ear left"></div>
          <div class="ear right"></div>

          <div class="head"></div>
          <div class="body"></div>

          <div class="eye left"></div>
          <div class="eye right"></div>

          <div class="nose"></div>
          <div class="mouth"></div>

          <div class="heart">♥</div>

        </div>


        <!-- TEDDY 2 -->

        <div
                class="teddy teddy2"
                data-id="2">

          <div class="ear left"></div>
          <div class="ear right"></div>

          <div class="head"></div>
          <div class="body"></div>

          <div class="eye left"></div>
          <div class="eye right"></div>

          <div class="nose"></div>
          <div class="mouth"></div>

          <div class="heart">♥</div>

        </div>


        <!-- TEDDY 3 -->

        <div
                class="teddy teddy3"
                data-id="3">

          <div class="ear left"></div>
          <div class="ear right"></div>

          <div class="head"></div>
          <div class="body"></div>

          <div class="eye left"></div>
          <div class="eye right"></div>

          <div class="nose"></div>
          <div class="mouth"></div>

          <div class="heart">♥</div>

        </div>


        <!-- TEDDY 4 -->

        <div
                class="teddy teddy4"
                data-id="4">

          <div class="ear left"></div>
          <div class="ear right"></div>

          <div class="head"></div>
          <div class="body"></div>

          <div class="eye left"></div>
          <div class="eye right"></div>

          <div class="nose"></div>
          <div class="mouth"></div>

          <div class="heart">♥</div>

        </div>


        <!-- TEDDY 5 -->

        <div
                class="teddy teddy5"
                data-id="5">

          <div class="ear left"></div>
          <div class="ear right"></div>

          <div class="head"></div>
          <div class="body"></div>

          <div class="eye left"></div>
          <div class="eye right"></div>

          <div class="nose"></div>
          <div class="mouth"></div>

          <div class="heart">♥</div>

        </div>


        <!-- TEDDY 6 -->

        <div
                class="teddy teddy6"
                data-id="6">

          <div class="ear left"></div>
          <div class="ear right"></div>

          <div class="head"></div>
          <div class="body"></div>

          <div class="eye left"></div>
          <div class="eye right"></div>

          <div class="nose"></div>
          <div class="mouth"></div>

          <div class="heart">♥</div>

        </div>


        <!-- TEDDY 7 -->

        <div
                class="teddy teddy7"
                data-id="7">

          <div class="ear left"></div>
          <div class="ear right"></div>

          <div class="head"></div>
          <div class="body"></div>

          <div class="eye left"></div>
          <div class="eye right"></div>

          <div class="nose"></div>
          <div class="mouth"></div>

          <div class="heart">♥</div>

        </div>


        <!-- TEDDY 8 -->

        <div
                class="teddy teddy8"
                data-id="8">

          <div class="ear left"></div>
          <div class="ear right"></div>

          <div class="head"></div>
          <div class="body"></div>

          <div class="eye left"></div>
          <div class="eye right"></div>

          <div class="nose"></div>
          <div class="mouth"></div>

          <div class="heart">♥</div>

        </div>


        <!-- TEDDY 9 -->

        <div
                class="teddy teddy9"
                data-id="9">

          <div class="ear left"></div>
          <div class="ear right"></div>

          <div class="head"></div>
          <div class="body"></div>

          <div class="eye left"></div>
          <div class="eye right"></div>

          <div class="nose"></div>
          <div class="mouth"></div>

          <div class="heart">♥</div>

        </div>


        <!-- TEDDY 10 -->

        <div
                class="teddy teddy10"
                data-id="10">

          <div class="ear left"></div>
          <div class="ear right"></div>

          <div class="head"></div>
          <div class="body"></div>

          <div class="eye left"></div>
          <div class="eye right"></div>

          <div class="nose"></div>
          <div class="mouth"></div>

          <div class="heart">♥</div>

        </div>

      </div>


      <!-- =====================================
           BIG DROP AREA
      ====================================== -->

      <div class="drop-space">

        <div class="drop-arrow">
          ↓
        </div>

      </div>


      <!-- =====================================
           MACHINE FLOOR
      ====================================== -->

      <div class="floor"></div>


      <!-- =====================================
           LARGE PRIZE CHUTE
      ====================================== -->

      <div
              id="prizeChute"
              class="prize-chute">

        <div class="chute-opening">

          <div class="chute-dark"></div>

        </div>

        <div class="chute-label">

          ♥ PRIZE CHUTE ♥

        </div>

      </div>


      <!-- =====================================
           GLASS REFLECTION
      ====================================== -->

      <div class="glass-reflection"></div>

    </div>


    <!-- =====================================
         CONTROLS
    ====================================== -->

    <div class="controls">

      <button
              id="leftButton"
              class="control-button"
              disabled>

        ◀

      </button>


      <button
              id="grabButton"
              class="grab-button"
              disabled>

        GRAB

        <small>
          SPACE
        </small>

      </button>


      <button
              id="rightButton"
              class="control-button"
              disabled>

        ▶

      </button>

    </div>

  </div>


  <!-- =========================================
       STATUS
  ========================================== -->

  <div class="status-box">

    <h2 id="messageTitle">
      💌 LOVE CLAW MACHINE
    </h2>

    <p id="message">
      Press START GAME to begin.
    </p>

    <div class="counter">

      TEDDIES OPENED:

      <span id="count">
                0
            </span>

      / 10

    </div>

  </div>


  <!-- =========================================
       MESSAGE MODAL
  ========================================== -->

  <div
          id="messageModal"
          class="modal hidden">

    <div class="modal-card">

      <button
              id="closeModal"
              class="close-button">

        ×

      </button>


      <img
              id="modalImage"
              class="modal-image"
              src=""
              alt="Memory">


      <div
              id="modalTeddy"
              class="modal-teddy">

        🧸

      </div>


      <h2 id="modalTitle">
        Teddy
      </h2>


      <p id="modalMessage">
        ...
      </p>


      <button
              id="continueButton"
              class="continue-button">

        ♥ CONTINUE ♥

      </button>

    </div>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
